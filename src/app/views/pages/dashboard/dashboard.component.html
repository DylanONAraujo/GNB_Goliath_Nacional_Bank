<div class="dashboard">

  <!-- Card de ações GNB -->
  <div class="panel">

    <mat-card>
      <mat-card-header>
        <mat-card-title class="panel_title">Ações GNB</mat-card-title>
        <mat-card-subtitle class="panel_subtitle">Cotações simuladas</mat-card-subtitle>
      </mat-card-header>

      <div class="stocks-list">
        <div class="stock-item" *ngFor="let stock of stocks">
          <div class="stock-item__info">
            <span class="stock-item__ticker">{{ stock.ticker }}</span>
            <span class="stock-item__name">{{ stock.name }}</span>
          </div>
          <div class="stock-item__right">
            <span class="stock-item__value">R$ {{ stock.value.toFixed(2) }}</span>
            <span class="stock-item__change"
              [class.positive]="stock.positive"
              [class.negative]="!stock.positive">
              {{ stock.positive ? '▲' : '▼' }}
              {{ stock.change > 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
            </span>
          </div>
        </div>
      </div>

    </mat-card>

  </div>

</div>
